worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    include /etc/nginx/trusted-proxies.conf;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    map $http_user_agent $commercial_intelligence_crawler {
        default 0;
        ~*ahrefsbot 1;
        ~*semrushbot 1;
        ~*similarwebbot 1;
        ~*builtwith 1;
    }

    limit_req_zone $binary_remote_addr zone=admin_media_upload:10m rate=3r/m;
    limit_conn_zone $binary_remote_addr zone=admin_media_upload_conn:10m;
    limit_req_zone $binary_remote_addr zone=public_upload:10m rate=6r/m;
    limit_conn_zone $binary_remote_addr zone=public_upload_conn:10m;
    limit_req_zone $binary_remote_addr zone=ipx_image:10m rate=12r/s;
    limit_conn_zone $binary_remote_addr zone=ipx_image_conn:10m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Keep framework and upstream server implementation headers out of public
    # responses. server_tokens also removes the Nginx version from its own
    # Server header.
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-AspNet-Version;
    proxy_hide_header X-AspNetMvc-Version;
    proxy_hide_header X-Generator;
    proxy_hide_header X-Runtime;

    # Storefront SSR adds a CSP header with inline-content hashes. Keep enough
    # upstream header buffer for that response so fresh or query-bearing SSR
    # requests do not become 502 responses at the edge.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    server {
        listen 8080;
        include /etc/nginx/generated-edge/storefront-server-names.conf;
        client_max_body_size 90m;
        client_header_timeout 10s;

        if ($commercial_intelligence_crawler) {
            return 403;
        }

        # Resolve API traffic through the dedicated api_ingress network. The
        # Go API trusts only the web container's pinned address on that network.
        set $api_upstream http://api-ingress:9000;
        set $storefront_upstream http://storefront:3000;
        auth_request /_internal/security/ip-block-check;

        location = /healthz {
            auth_request off;
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # Nginx auth_request uses this internal subrequest to protect pages,
        # static files, and SSR/image traffic without exposing the check path.
        location = /_internal/security/ip-block-check {
            internal;
            auth_request off;
            access_log off;
            proxy_pass http://api-ingress:9000/_internal/security/ip-block-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        location ^~ /_internal/ {
            access_log off;
            return 404;
        }

        # This storefront is not Shopify or WooCommerce. Return a neutral
        # not-found response for common platform fingerprint probes.
        location = /products.json {
            access_log off;
            return 404;
        }

        location ~* ^/products/(?:count\.)?json$ {
            access_log off;
            return 404;
        }

        location = /products.js {
            access_log off;
            return 404;
        }

        location = /collections.json {
            access_log off;
            return 404;
        }

        location ~* ^/collections/[^/]+/products\.json$ {
            access_log off;
            return 404;
        }

        location ~* ^/collections/[^/]+\.json$ {
            access_log off;
            return 404;
        }

        location = /search/suggest.json {
            access_log off;
            return 404;
        }

        location = /recommendations/products.json {
            access_log off;
            return 404;
        }

        location = /cart.js {
            access_log off;
            return 404;
        }

        location = /cart/add.js {
            access_log off;
            return 404;
        }

        location = /cart/update.js {
            access_log off;
            return 404;
        }

        location = /cart/change.js {
            access_log off;
            return 404;
        }

        location = /cart/clear.js {
            access_log off;
            return 404;
        }

        location ^~ /wc-ajax/ {
            access_log off;
            return 404;
        }

        location ~* ^/wp-json/(wc(?:/store)?|wp/v2)(?:/|$) {
            access_log off;
            return 404;
        }

        location = /api/admin/media/assets {
            auth_request off;
            client_max_body_size 86m;
            client_body_timeout 20s;
            limit_req zone=admin_media_upload burst=2 nodelay;
            limit_conn admin_media_upload_conn 2;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_request_buffering on;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location = /api/v1/registration/warranty/claim {
            auth_request off;
            client_max_body_size 82m;
            client_body_timeout 20s;
            limit_req zone=public_upload burst=2 nodelay;
            limit_conn public_upload_conn 2;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_request_buffering on;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location ~ ^/api/v1/(customer-service/attachments|suggestion-feedback/upload|showcase/upload)$ {
            auth_request off;
            client_max_body_size 90m;
            client_body_timeout 20s;
            limit_req zone=public_upload burst=2 nodelay;
            limit_conn public_upload_conn 2;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_request_buffering on;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/ {
            auth_request off;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location ^~ /_ipx/ {
            limit_req zone=ipx_image burst=36 nodelay;
            limit_req_status 429;
            limit_conn ipx_image_conn 10;
            proxy_pass $storefront_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_read_timeout 45s;
            proxy_send_timeout 45s;
        }

        location ^~ /uploads/site-logo/ {
            alias /srv/site-logo-uploads/site-logo/;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location ^~ /uploads/ {
            alias /srv/uploads/;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        location / {
            proxy_pass $storefront_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        include /etc/nginx/snippets/security-headers.conf;
    }

    server {
        listen 8080;
        include /etc/nginx/generated-edge/admin-server-names.conf;
        client_max_body_size 90m;
        client_header_timeout 10s;

        if ($commercial_intelligence_crawler) {
            return 403;
        }

        set $api_upstream http://api-ingress:9000;
        set $admin_upstream http://admin:8080;
        auth_request /_internal/security/ip-block-check;

        location = /healthz {
            auth_request off;
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location = /_internal/security/ip-block-check {
            internal;
            auth_request off;
            access_log off;
            proxy_pass http://api-ingress:9000/_internal/security/ip-block-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        location = /api/admin/media/assets {
            auth_request off;
            client_max_body_size 86m;
            client_body_timeout 20s;
            limit_req zone=admin_media_upload burst=2 nodelay;
            limit_conn admin_media_upload_conn 2;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_request_buffering on;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /api/ {
            auth_request off;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location / {
            proxy_pass $admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        include /etc/nginx/snippets/security-headers.conf;
    }
}
