# The public edge proxy forwards requests to this container over a private
# Docker network. Only private proxy networks are trusted here; public
# clients cannot reach this Nginx service directly in production.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;

# Caddy/another trusted edge proxy must append the client address to this
# header. real_ip_recursive selects the first non-trusted address in the
# forwarded chain instead of treating every request as the proxy itself.
real_ip_header X-Forwarded-For;
real_ip_recursive on;
