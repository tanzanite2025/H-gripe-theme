name: Publish Production Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum

      - name: Test backend
        working-directory: go-backend
        run: go test ./...

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            nuxt-i18n/package-lock.json
            go-backend/web/admin/package-lock.json
            site-quality-runner/package-lock.json

      - name: Build storefront
        working-directory: nuxt-i18n
        run: |
          npm ci
          npm run build
          npm run check:production-artifacts

      - name: Build admin
        working-directory: go-backend/web/admin
        run: |
          npm ci
          npm run build

      - name: Test Site Quality runner
        working-directory: site-quality-runner
        run: |
          npm ci
          npm test

      - name: Validate production Compose
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: docker compose --env-file deployment/production.env.example -f compose.prod.yml config --quiet

      - name: Scan full Git history for secrets
        id: gitleaks
        continue-on-error: true
        run: |
          mkdir -p security-reports
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.2 \
            git \
            /repo \
            --config=/repo/.gitleaks.toml \
            --log-opts="--all --tags" \
            --redact \
            --report-format sarif \
            --report-path /repo/security-reports/gitleaks-history.sarif

      - name: Upload gitleaks release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-release-report
          path: security-reports/gitleaks-history.sarif
          if-no-files-found: warn
          retention-days: 90

      - name: Block release on historical secrets
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" != "success" ]; then
            echo "gitleaks found historical secrets or failed to scan the repository"
            exit 1
          fi

  publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: commerce-platform-api
            context: ./go-backend
            dockerfile: ./go-backend/Dockerfile
          - image: commerce-platform-storefront
            context: ./nuxt-i18n
            dockerfile: ./nuxt-i18n/Dockerfile
          - image: commerce-platform-admin
            context: ./go-backend/web/admin
            dockerfile: ./go-backend/web/admin/Dockerfile
          - image: commerce-platform-web
            context: ./deployment
            dockerfile: ./deployment/docker/web.Dockerfile
          - image: commerce-platform-site-quality-runner
            context: ./site-quality-runner
            dockerfile: ./site-quality-runner/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=master
            type=raw,value=sha-${{ github.sha }}

      - name: Build image for security scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: |
            VERSION=sha-${{ github.sha }}
            NUXT_PUBLIC_SITE_URL=${{ vars.STOREFRONT_SITE_URL || 'https://learn.gripe' }}
            NUXT_IMAGE_DOMAINS=${{ vars.STOREFRONT_IMAGE_DOMAINS || 'learn.gripe' }}
            NUXT_IMAGE_INTERNAL_ORIGIN=${{ vars.STOREFRONT_IMAGE_INTERNAL_ORIGIN || 'http://web:8080' }}
            NUXT_IMAGE_MAX_INPUT_PIXELS=${{ vars.STOREFRONT_IMAGE_MAX_INPUT_PIXELS || '24000000' }}
            NUXT_IMAGE_OPTIMIZE_UPLOADS=${{ vars.STOREFRONT_IMAGE_OPTIMIZE_UPLOADS || 'false' }}
          load: true
          tags: local/${{ matrix.image }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan exact local image with Trivy
        id: trivy
        continue-on-error: true
        run: |
          mkdir -p security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/security-reports:/reports" \
            aquasec/trivy:0.58.2 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format json \
            --output /reports/trivy-${{ matrix.image }}.json \
            local/${{ matrix.image }}:${{ github.sha }}
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            local/${{ matrix.image }}:${{ github.sha }}

      - name: Scan exact local image with Grype
        id: grype
        continue-on-error: true
        run: |
          mkdir -p security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/security-reports:/reports" \
            anchore/grype:v0.116.0 \
            docker:local/${{ matrix.image }}:${{ github.sha }} \
            --output json > "security-reports/grype-${{ matrix.image }}.json"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:v0.116.0 \
            docker:local/${{ matrix.image }}:${{ github.sha }} \
            --only-fixed \
            --fail-on high \
            --output table

      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-${{ matrix.image }}
          path: security-reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Block release on high or critical findings
        if: always()
        run: |
          if [ "${{ steps.trivy.outcome }}" != "success" ] || [ "${{ steps.grype.outcome }}" != "success" ]; then
            echo "Trivy or Grype found high/critical vulnerabilities in the exact image to be released"
            exit 1
          fi

      - name: Push scanned image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "local/${{ matrix.image }}:${{ github.sha }}" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
