name: Publish Production Images

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      storefront_site_url:
        description: "Optional canonical-domain migration target. Enter the HTTPS origin; STOREFRONT_SITE_URL is saved after all images publish."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require master branch for manual production publication
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
        run: |
          echo "Production images can only be published from the master branch."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-backend/go.mod
          cache-dependency-path: go-backend/go.sum

      - name: Install pinned Caddy for edge integration tests
        run: |
          caddy_version="2.11.4"
          curl --fail --silent --show-error --location \
            "https://github.com/caddyserver/caddy/releases/download/v${caddy_version}/caddy_${caddy_version}_linux_amd64.tar.gz" \
            --output /tmp/caddy-linux-amd64.tar.gz
          tar -xzf /tmp/caddy-linux-amd64.tar.gz -C /tmp caddy
          sudo install -m 0755 /tmp/caddy /usr/local/bin/caddy
          caddy version

      - name: Prepare production Nginx upload cache boundary test
        run: |
          production_nginx_image="$(awk '$1 == "FROM" { print $2; exit }' deployment/docker/web.Dockerfile)"
          test -n "$production_nginx_image"
          docker pull "$production_nginx_image"
          echo "PRODUCTION_NGINX_UPLOAD_CACHE_BOUNDARY_TEST_IMAGE=$production_nginx_image" >> "$GITHUB_ENV"

      - name: Test backend
        working-directory: go-backend
        env:
          CADDY_EDGE_INTEGRATION_TEST_REQUIRED: "true"
        run: go test ./...

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            nuxt-i18n/package-lock.json
            go-backend/web/admin/package-lock.json
            site-quality-runner/package-lock.json

      - name: Build storefront
        working-directory: nuxt-i18n
        env:
          STOREFRONT_SITE_URL: ${{ inputs.storefront_site_url || vars.STOREFRONT_SITE_URL }}
          STOREFRONT_DOMAIN_MIGRATION: ${{ inputs.storefront_site_url != '' }}
          STOREFRONT_CURRENT_SITE_URL: ${{ vars.STOREFRONT_SITE_URL }}
        run: |
          npm ci
          npm run test:storefront-publish-domain-guard
          npm run check:storefront-publish-domain
          npm run build
          npm run check:production-artifacts
          npm run smoke:html-cache
          npm run test:page-feedback-independent-translation-loading

      - name: Build admin
        working-directory: go-backend/web/admin
        run: |
          npm ci
          npm run build

      - name: Test Site Quality runner
        working-directory: site-quality-runner
        run: |
          npm ci
          npm test

      - name: Validate production Compose
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          ALLOW_EXAMPLE_ENV: "true"
          CHECK_CONNECTIVITY: "false"
        run: |
          docker compose --env-file deployment/production.env.example -f compose.prod.yml config --quiet
          bash deployment/verify-vps-release-boundary.sh

      - name: Validate local computer backup release boundaries without starting services
        run: node --test deployment/validate-local-computer-backup-release-overlay-gate-preservation-and-maintenance-image-publication.cjs

      - name: Scan full Git history for secrets
        id: gitleaks
        if: always()
        continue-on-error: true
        run: |
          mkdir -p security-reports
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.2 \
            git \
            /repo \
            --config=/repo/.gitleaks.toml \
            --log-opts="--all --tags" \
            --redact \
            --report-format sarif \
            --report-path /repo/security-reports/gitleaks-history.sarif

      - name: Upload gitleaks release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-release-report
          path: security-reports/gitleaks-history.sarif
          if-no-files-found: warn
          retention-days: 90

      - name: Block release on historical secrets
        if: always()
        run: |
          if [ "${{ steps.gitleaks.outcome }}" != "success" ]; then
            echo "gitleaks found historical secrets or failed to scan the repository"
            exit 1
          fi

  resolve-storefront-site-url:
    if: github.event_name == 'workflow_dispatch' && inputs.storefront_site_url != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site_url: ${{ steps.normalize.outputs.site_url }}
    steps:
      - name: Validate requested canonical storefront origin
        id: normalize
        env:
          REQUESTED_STOREFRONT_SITE_URL: ${{ inputs.storefront_site_url }}
          CURRENT_STOREFRONT_SITE_URL: ${{ vars.STOREFRONT_SITE_URL }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const requestedValue = process.env.REQUESTED_STOREFRONT_SITE_URL?.trim()
          const currentValue = process.env.CURRENT_STOREFRONT_SITE_URL?.trim()
          if (!requestedValue) throw new Error('The migration target origin is empty.')

          const requestedUrl = new URL(requestedValue)
          if (requestedUrl.protocol !== 'https:' || requestedUrl.username || requestedUrl.password || requestedUrl.pathname !== '/' || requestedUrl.search || requestedUrl.hash) {
            throw new Error('Enter only the new canonical HTTPS origin, such as https://shop.example.com')
          }

          if (currentValue) {
            const currentUrl = new URL(currentValue)
            if (currentUrl.origin === requestedUrl.origin) {
              throw new Error('The migration input matches STOREFRONT_SITE_URL. Leave it blank for a routine publish.')
            }
          }

          console.log(`site_url=${requestedUrl.origin}`)
          NODE

  publish:
    needs:
      - validate
      - resolve-storefront-site-url
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.resolve-storefront-site-url.result == 'success' || needs.resolve-storefront-site-url.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: commerce-platform-api
            context: ./go-backend
            dockerfile: ./go-backend/Dockerfile
          - image: commerce-platform-local-backup-maintenance
            context: ./go-backend
            dockerfile: ./go-backend/Dockerfile
            target: local-backup-maintenance
          - image: commerce-platform-storefront
            context: ./nuxt-i18n
            dockerfile: ./nuxt-i18n/Dockerfile
          - image: commerce-platform-admin
            context: ./go-backend/web/admin
            dockerfile: ./go-backend/web/admin/Dockerfile
          - image: commerce-platform-web
            context: ./deployment
            dockerfile: ./deployment/docker/web.Dockerfile
          - image: commerce-platform-site-quality-runner
            context: ./site-quality-runner
            dockerfile: ./site-quality-runner/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=master
            type=raw,value=sha-${{ github.sha }}

      - name: Build image for security scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64
          build-args: |
            VERSION=sha-${{ github.sha }}
            NUXT_PUBLIC_SITE_URL=${{ needs.resolve-storefront-site-url.outputs.site_url || vars.STOREFRONT_SITE_URL }}
            NUXT_IMAGE_DOMAINS=${{ vars.STOREFRONT_IMAGE_DOMAINS }}
            NUXT_IMAGE_INTERNAL_ORIGIN=${{ vars.STOREFRONT_IMAGE_INTERNAL_ORIGIN || 'http://web:8080' }}
            NUXT_IMAGE_MAX_INPUT_PIXELS=${{ vars.STOREFRONT_IMAGE_MAX_INPUT_PIXELS || '24000000' }}
            NUXT_IMAGE_OPTIMIZE_UPLOADS=${{ vars.STOREFRONT_IMAGE_OPTIMIZE_UPLOADS || 'true' }}
          load: true
          tags: local/${{ matrix.image }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          # Chromium receives frequent Debian security updates; do not reuse a
          # stale cached apt layer for the image whose release gate scans it.
          no-cache: ${{ matrix.image == 'commerce-platform-site-quality-runner' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan exact local image with Trivy
        id: trivy
        continue-on-error: true
        run: |
          mkdir -p security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/security-reports:/reports" \
            aquasec/trivy:0.58.2 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format json \
            --output /reports/trivy-${{ matrix.image }}.json \
            local/${{ matrix.image }}:${{ github.sha }}
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            local/${{ matrix.image }}:${{ github.sha }}

      - name: Scan exact local image with Grype
        id: grype
        continue-on-error: true
        run: |
          mkdir -p security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/security-reports:/reports" \
            anchore/grype:v0.116.0 \
            docker:local/${{ matrix.image }}:${{ github.sha }} \
            --output json > "security-reports/grype-${{ matrix.image }}.json"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:v0.116.0 \
            docker:local/${{ matrix.image }}:${{ github.sha }} \
            --only-fixed \
            --fail-on high \
            --output table

      - name: Upload image scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-scan-${{ matrix.image }}
          path: security-reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Block release on high or critical findings
        if: always()
        run: |
          if [ "${{ steps.trivy.outcome }}" != "success" ] || [ "${{ steps.grype.outcome }}" != "success" ]; then
            echo "Trivy or Grype found high/critical vulnerabilities in the exact image to be released"
            exit 1
          fi

      - name: Push scanned image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "local/${{ matrix.image }}:${{ github.sha }}" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  save-storefront-site-url-after-successful-domain-migration:
    if: github.event_name == 'workflow_dispatch' && inputs.storefront_site_url != ''
    needs:
      - resolve-storefront-site-url
      - publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Save published canonical origin to repository Actions variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STOREFRONT_SITE_URL: ${{ needs.resolve-storefront-site-url.outputs.site_url }}
        run: gh variable set STOREFRONT_SITE_URL --body "$STOREFRONT_SITE_URL" --repo "$GITHUB_REPOSITORY"
