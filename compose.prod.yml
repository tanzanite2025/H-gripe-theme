x-edge-config-environment: &edge-config-environment
  CONFIG_FILE: /app/config/config.production.yaml
  SERVER_MODE: release
  SERVER_PORT: :9000
  SERVER_BASE_URL: ${SERVER_BASE_URL:?SERVER_BASE_URL is required}
  DB_HOST: db
  DB_PORT: "5432"
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_AUTO_MIGRATE: "false"
  DB_LOG_LEVEL: warn
  OPS_EDGE_CONFIG_ENVIRONMENT: ${OPS_EDGE_CONFIG_ENVIRONMENT:?OPS_EDGE_CONFIG_ENVIRONMENT is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES is required}
  LOG_LEVEL: info
  LOG_FORMAT: json

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db
    shm_size: 256m
    mem_limit: 1536m
    cpus: 1.00
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    networks:
      - cache
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 0.50
    logging: *default-logging

  migrate:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/${IMAGE_PREFIX:-commerce-platform}-api:${IMAGE_TAG:-master}
    pull_policy: always
    restart: "no"
    command: ["migrate"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 0.75
    logging: *default-logging

  media-derivatives-backfill:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/${IMAGE_PREFIX:-commerce-platform}-api:${IMAGE_TAG:-master}
    pull_policy: always
    restart: "no"
    command: ["backfill-media-derivatives"]
    environment:
      <<: *api-environment
      GOMEMLIMIT: 512MiB
      GOMAXPROCS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads
      - site_logo_uploads:/app/site-logo-uploads
    networks:
      - db
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.00
    logging: *default-logging

  edge-config:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/${IMAGE_PREFIX:-commerce-platform}-api:${IMAGE_TAG:-master}
    pull_policy: always
    restart: "no"
    command: ["render-edge-config"]
    environment:
      <<: *edge-config-environment
      OPS_EDGE_CONFIG_OUTPUT_DIR: /var/lib/edge-config
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${OPS_EDGE_CONFIG_DIR:?OPS_EDGE_CONFIG_DIR is required}:/var/lib/edge-config
    networks:
      - db
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 0.75
    logging: *default-logging

  api:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/${IMAGE_PREFIX:-commerce-platform}-api:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "9000"
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      media-derivatives-backfill:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      site-quality-runner:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - site_logo_uploads:/app/site-logo-uploads
    networks:
      - db
      - cache
      - app
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 1.50
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  site-quality-runner:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/${IMAGE_PREFIX:-commerce-platform}-site-quality-runner:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PORT: "8080"
      SITE_QUALITY_ALLOWED_ORIGIN: ${STOREFRONT_BASE_URL:?STOREFRONT_BASE_URL is required}
      SITE_QUALITY_RUNNER_TOKEN: ${SITE_QUALITY_RUNNER_TOKEN:?SITE_QUALITY_RUNNER_TOKEN is required}
      SITE_QUALITY_RUNNER_TIMEOUT_SECONDS: ${SITE_QUALITY_RUNNER_TIMEOUT_SECONDS:-90}
      SITE_QUALITY_RUNNER_WORKER_HEAP_LIMIT_MB: ${SITE_QUALITY_RUNNER_WORKER_HEAP_LIMIT_MB:-1024}
      SITE_QUALITY_RUNNER_MAX_CONCURRENCY: ${WORKER_SITE_QUALITY_PROVIDER_CONCURRENCY:-1}
      SITE_QUALITY_RUNNER_ALLOW_PRIVATE_TARGETS: "false"
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1024m
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2048m
    memswap_limit: 2048m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  storefront:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/${IMAGE_PREFIX:-commerce-platform}-storefront:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_PUBLIC_API_BASE: /api/v1
      NUXT_API_INTERNAL_ORIGIN: http://api:9000
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?NUXT_PUBLIC_SITE_URL is required}
      NUXT_IMAGE_INTERNAL_ORIGIN: ${NUXT_IMAGE_INTERNAL_ORIGIN:-http://web:8080}
      NUXT_IMAGE_OPTIMIZE_UPLOADS: ${NUXT_IMAGE_OPTIMIZE_UPLOADS:-false}
      NUXT_PUBLIC_IMAGE_UPLOAD_OPTIMIZATION_ENABLED: ${NUXT_IMAGE_OPTIMIZE_UPLOADS:-false}
      UV_THREADPOOL_SIZE: ${STOREFRONT_IMAGE_THREADPOOL_SIZE:-2}
      STOREFRONT_IMAGE_SHARP_CONCURRENCY: ${STOREFRONT_IMAGE_SHARP_CONCURRENCY:-1}
      STOREFRONT_IMAGE_SHARP_CACHE_MEMORY_MB: ${STOREFRONT_IMAGE_SHARP_CACHE_MEMORY_MB:-16}
      NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NUXT_PUBLIC_REQUEST_SIGNING_KEY: ${REQUEST_SIGNING_KEY:?REQUEST_SIGNING_KEY is required}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required}
      NUXT_HTML_CACHE_DRIVER: ${NUXT_HTML_CACHE_DRIVER:-redis}
      NUXT_HTML_CACHE_PREFIX: ${NUXT_HTML_CACHE_PREFIX:-commerce-platform:storefront:html-cache:v2}
      NUXT_HTML_CACHE_REDIS_MODE: ${REDIS_MODE:-standalone}
      NUXT_HTML_CACHE_REDIS_HOST: ${REDIS_HOST:-redis}
      NUXT_HTML_CACHE_REDIS_PORT: ${REDIS_PORT:-6379}
      NUXT_HTML_CACHE_REDIS_USERNAME: ${REDIS_USERNAME:-}
      NUXT_HTML_CACHE_REDIS_SENTINEL_ADDRS: ${REDIS_ADDRS:-}
      NUXT_HTML_CACHE_REDIS_MASTER_NAME: ${REDIS_MASTER_NAME:-}
      NUXT_HTML_CACHE_REDIS_SENTINEL_USERNAME: ${REDIS_SENTINEL_USERNAME:-}
      NUXT_HTML_CACHE_REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:-}
      NUXT_HTML_CACHE_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      NUXT_HTML_CACHE_REDIS_DB: ${NUXT_HTML_CACHE_REDIS_DB:-1}
      NUXT_HTML_CACHE_REDIS_TTL_SECONDS: ${NUXT_HTML_CACHE_REDIS_TTL_SECONDS:-604800}
      NUXT_HTML_CACHE_REDIS_SCAN_COUNT: ${NUXT_HTML_CACHE_REDIS_SCAN_COUNT:-100}
      NUXT_HTML_CACHE_PURGE_TOKEN: ${NUXT_HTML_CACHE_PURGE_TOKEN:?NUXT_HTML_CACHE_PURGE_TOKEN is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - cache
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1024m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/_internal/image-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  admin:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/${IMAGE_PREFIX:-commerce-platform}-admin:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      media-derivatives-backfill:
        condition: service_completed_successfully
    networks:
      - app
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  web:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE is required}/${IMAGE_PREFIX:-commerce-platform}-web:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      storefront:
        condition: service_healthy
      admin:
        condition: service_healthy
      edge-config:
        condition: service_completed_successfully
    volumes:
      - uploads:/srv/uploads:ro
      - site_logo_uploads:/srv/site-logo-uploads:ro
      - ${OPS_EDGE_CONFIG_DIR:?OPS_EDGE_CONFIG_DIR is required}:/etc/nginx/generated-edge:ro
    networks:
      app: {}
      edge:
        aliases:
          - theme-web
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -r /srv/uploads && wget -q --spider http://127.0.0.1:8080/healthz && wget -q --spider 'http://storefront:3000/_internal/image-health?source=internal'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

networks:
  db:
    internal: true
  cache:
    internal: true
  app: {}
  edge:
    external: true
    name: shared-edge

volumes:
  postgres_data:
    name: ${POSTGRES_DATA_VOLUME_NAME:-commerce-platform-postgres-data}
  redis_data:
    name: ${REDIS_DATA_VOLUME_NAME:-commerce-platform-redis-data}
  uploads:
    name: ${UPLOADS_VOLUME_NAME:-commerce-platform-uploads}
  site_logo_uploads:
    name: ${SITE_LOGO_UPLOADS_VOLUME_NAME:-commerce-platform-site-logo-uploads}
