name: commerce-platform-dev

networks:
  commerce-platform-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: commerce-platform-postgres
    environment:
      POSTGRES_USER: commerce_platform
      POSTGRES_PASSWORD: commerce_platform_password
      POSTGRES_DB: commerce_platform
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_HOST_PORT:-9400}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - commerce-platform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: commerce-platform-redis
    ports:
      - "${REDIS_HOST_PORT:-9562}:6379"
    volumes:
      - redis-data:/data
    networks:
      - commerce-platform-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  site-quality-runner:
    build:
      context: ./site-quality-runner
      dockerfile: Dockerfile
    container_name: commerce-platform-site-quality-runner
    ports:
      - "9240:8080"
    environment:
      - SITE_QUALITY_ALLOWED_ORIGIN=${SITE_QUALITY_ALLOWED_ORIGIN:-http://host.docker.internal:9199}
      - SITE_QUALITY_RUNNER_TOKEN=dev-site-quality-runner-token-0123456789
      - SITE_QUALITY_RUNNER_ALLOW_PRIVATE_TARGETS=true
      - SITE_QUALITY_RUNNER_TIMEOUT_SECONDS=90
      - SITE_QUALITY_RUNNER_WORKER_HEAP_LIMIT_MB=1024
      - SITE_QUALITY_RUNNER_MAX_CONCURRENCY=1
    networks:
      - commerce-platform-network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1024m
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2048m
    memswap_limit: 2048m
    cpus: 1.00
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    container_name: commerce-platform-api
    ports:
      - "9200:9000"
    environment:
      - SERVER_MODE=debug
      - SERVER_PORT=:9000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=commerce_platform
      - DB_PASSWORD=commerce_platform_password
      - DB_NAME=commerce_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dev-secret-key-change-in-production
      - PAYMENT_CONFIG_MASTER_KEY=${PAYMENT_CONFIG_MASTER_KEY:-dev-payment-config-master-key-change-before-production}
      - LOG_LEVEL=debug
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/uploads
      - STORAGE_BASE_URL=http://localhost:9200
      - SITE_LOGO_STORAGE_TYPE=local
      - SITE_LOGO_STORAGE_LOCAL_PATH=/app/site-logo-uploads
      - SITE_LOGO_STORAGE_BASE_URL=http://localhost:9200
      - STOREFRONT_HTML_CACHE_PURGE_URL=http://frontend:3000/_internal/html-cache/purge
      - STOREFRONT_INTERNAL_ORIGIN=http://frontend:3000
      - STOREFRONT_HTML_CACHE_PURGE_TOKEN=dev-html-cache-purge-token
      - STOREFRONT_HTML_CACHE_PURGE_DEBOUNCE_MS=500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - commerce-platform-network
    volumes:
      - ./go-backend/uploads:/app/uploads
      - ./go-backend/site-logo-uploads:/app/site-logo-uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./nuxt-i18n
      args:
        API_INTERNAL_ORIGIN: http://backend:9000
    container_name: commerce-platform-frontend
    ports:
      - "9100:3000"
    environment:
      - API_BASE_URL=http://backend:9000
      - NUXT_PUBLIC_API_BASE=http://localhost:9200
      - NUXT_HTML_CACHE_DRIVER=redis
      - NUXT_HTML_CACHE_PREFIX=commerce-platform:storefront:html-cache:dev
      - NUXT_HTML_CACHE_REDIS_HOST=redis
      - NUXT_HTML_CACHE_REDIS_PORT=6379
      - NUXT_HTML_CACHE_REDIS_DB=1
      - NUXT_HTML_CACHE_REDIS_TTL_SECONDS=604800
      - NUXT_HTML_CACHE_PURGE_TOKEN=dev-html-cache-purge-token
      - NUXT_HTML_CACHE_REDIS_SCAN_COUNT=100
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - commerce-platform-network
    restart: unless-stopped

  # 可选: Adminer (数据库管理工具)
  adminer:
    image: adminer:latest
    container_name: commerce-platform-adminer
    ports:
      - "${ADMINER_HOST_PORT:-9600}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - commerce-platform-network
    restart: unless-stopped
    profiles:
      - tools

  # 可选: Redis Commander (Redis管理工具)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: commerce-platform-redis-commander
    ports:
      - "${REDIS_COMMANDER_HOST_PORT:-9700}:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    networks:
      - commerce-platform-network
    restart: unless-stopped
    profiles:
      - tools
