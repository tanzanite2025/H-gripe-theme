# Storefront Go Backend Configuration

server:
  port: ":9200"
  mode: "debug"  # debug, release, test
  base_url: "http://localhost:9200"  # 用于生成 Sitemap 和 URL
  read_timeout: 60
  read_header_timeout: 10
  write_timeout: 60
  idle_timeout: 120
  max_header_bytes: 1048576
  trusted_proxies: []  # Required in release mode; use TRUSTED_PROXIES behind a proxy.

database:
  driver: "postgres"  # postgres or mysql
  host: "localhost"
  port: 9400
  username: "commerce_platform"
  password: "commerce_platform_password"
  database: "commerce_platform"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600  # seconds
  auto_migrate: true
  log_level: "silent"  # silent, error, warn, info

redis:
  mode: "standalone"  # standalone or sentinel; cluster is rejected until all multi-key scripts are hash-tagged
  host: "localhost"
  port: 9510
  addrs: []  # sentinel example: ["redis-sentinel-1:26379", "redis-sentinel-2:26379", "redis-sentinel-3:26379"]
  username: ""
  password: ""
  db: 0
  pool_size: 10
  master_name: ""  # required for sentinel
  sentinel_username: ""
  sentinel_password: ""

jwt:
  secret: "your-secret-key-change-this-in-production"
  expire_hours: 24
  refresh_expire_hours: 168  # 7 days

oauth:
  google_client_id: ""  # Set via GOOGLE_CLIENT_ID or NUXT_PUBLIC_GOOGLE_CLIENT_ID

google_merchant:
  client_id: ""  # GOOGLE_MERCHANT_CLIENT_ID
  client_secret: ""  # GOOGLE_MERCHANT_CLIENT_SECRET
  redirect_url: "http://localhost:9200/api/admin/google-merchant/oauth/callback"
  post_connect_url: "http://localhost:9300/google-merchant"
  token_encryption_key: ""  # Set via GOOGLE_MERCHANT_TOKEN_ENCRYPTION_KEY
  state_ttl_seconds: 600

google_indexing:
  # Google Indexing API is disabled by default. Keep service account material
  # outside source control and provide either JSON or a file path, not both.
  enabled: false
  service_account_json: ""
  service_account_file: ""
  request_timeout_seconds: 15

social_oauth:
  # Set provider credentials with SOCIAL_OAUTH_* environment variables.
  meta:
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:9200/api/admin/social/oauth/callback"
    scopes: ""
  x:
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:9200/api/admin/social/oauth/callback"
    scopes: ""
  youtube:
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:9200/api/admin/social/oauth/callback"
    scopes: ""
  reddit:
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:9200/api/admin/social/oauth/callback"
    scopes: ""
  post_connect_url: "http://localhost:9300/social"
  token_encryption_key: ""
  state_ttl_seconds: 600
  meta_graph_api_version: "v23.0"

i18n:
  default_locale: "en"
  supported_locales:
    - en
    - zh_cn
    - fr
    - de
    - es
    - ja
    - ko
    - it
    - pt
    - ru
    - ar
    - nl
    - tr
    - id
    - th
    - sv
    - da
    - fi
    - hi
    - ms

cors:
  allowed_origins:
    - "http://localhost:9199"
    - "http://127.0.0.1:9199"
    - "http://localhost:9100"
    - "http://127.0.0.1:9100"
    - "http://localhost:9200"
    - "http://127.0.0.1:9200"
    - "http://localhost:9300"
    - "http://127.0.0.1:9300"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept-Language"
    - "Idempotency-Key"
    - "X-CSRF-Token"
    - "X-Locale"
    - "X-Timezone"
    - "X-Display-Currency"
    - "X-Market-Country"
    - "X-Country-Code"
    - "X-Device-Fingerprint"
    - "X-Quick-Buy-Session"
    - "X-Anonymous-ID"
  expose_headers:
    - "Content-Length"
    - "Idempotency-Replayed"
    - "Retry-After"
  allow_credentials: true
  max_age: 43200  # 12 hours

cookie:
  secure: "auto"  # auto enables Secure on HTTPS/release, disables it for local HTTP
  same_site: "lax"  # lax, strict, none
  domain: ""  # keep host-only unless you explicitly need a parent domain

cache:
  default_ttl: 3600  # seconds
  post_ttl: 3600
  product_ttl: 1800
  product_lock_ttl: 5
  settings_ttl: 7200

media_upload:
  # Per authenticated uploader; 20 GiB in bytes.
  account_storage_quota_bytes: 21474836480

quick_buy_rate_limit:
  enabled: true
  ip_requests_per_minute: 120
  ip_burst: 40
  session_requests_per_minute: 60
  session_burst: 20
  fail_open: true

feedback_rate_limit:
  enabled: true
  read_ip_requests_per_minute: 120
  read_ip_burst: 40
  write_ip_requests_per_minute: 12
  write_ip_burst: 4
  write_user_requests_per_minute: 6
  write_user_burst: 2
  fail_open: false

showcase_upload_protection:
  enabled: true
  window_seconds: 60
  max_uploads_per_user: 3
  max_uploads_per_ip: 6
  max_uploads_per_ip_prefix: 18
  daily_max_uploads_per_user: 12
  daily_max_uploads_per_ip: 24
  daily_max_bytes_per_user: 104857600
  daily_max_bytes_per_ip: 209715200
  max_pending_submissions_per_user: 10
  failure_window_seconds: 900
  max_failures_per_user: 5
  max_failures_per_ip: 10
  block_duration_seconds: 1800

worker:
  enabled: false  # Enable only after registering Asynq task handlers
  tracking_polling_enabled: false  # Tracking polling scheduler can run without Asynq worker
  tracking_polling_interval_seconds: 300
  tracking_polling_batch_limit: 20
  visitor_profile_ip_address_retention_days: 30
  outbox_dispatch_enabled: false
  outbox_dispatch_interval_seconds: 10
  outbox_dispatch_batch_limit: 100
  outbox_dispatch_lock_timeout_seconds: 300
  payment_expiration_enabled: false
  payment_expiration_interval_seconds: 900
  payment_pending_ttl_seconds: 1800
  payment_expiration_batch_limit: 100
  payment_risk_monitoring_enabled: false
  payment_risk_monitoring_interval_seconds: 3600
  # Manual inspections and finding rechecks remain available when the job worker is enabled.
  site_quality_auto_scan_enabled: false
  site_quality_dispatch_interval_seconds: 30
  site_quality_batch_limit: 1
  site_quality_lease_timeout_seconds: 900
  site_quality_sample_count: 3
  site_quality_confirmations: 2
  site_quality_clean_evaluations: 2
  site_quality_provider_concurrency: 1
  site_quality_provider_spacing_seconds: 5
  # Independent from worker.enabled. Reads ExchangeRate-API once at startup and then daily.
  # Base currency comes from backend entry currency; targets come from enabled market display currencies.
  exchange_rate_sync_enabled: true
  exchange_rate_sync_interval_seconds: 86400
  media_derivative_rebuild_enabled: true
  media_derivative_rebuild_interval_seconds: 5
  media_derivative_rebuild_batch_limit: 10
  showcase_cleanup_enabled: true
  showcase_cleanup_interval_seconds: 86400
  showcase_pending_ttl_seconds: 2592000
  showcase_cleanup_batch_limit: 100

site_quality:
  runner_url: ""  # SITE_QUALITY_RUNNER_URL
  runner_token: ""  # SITE_QUALITY_RUNNER_TOKEN
  runner_timeout_seconds: 90
  throttling_method: "simulate"  # simulate or devtools
  lighthouse_run_count: 1  # Increase to 3 for baseline median filtering.
  render_wait_selector: ""  # Optional CSS selector required before rendered DOM capture.
  render_wait_timeout_ms: 3000
  heading_settle_ms: 1500
  structured_data_settle_ms: 1500

order_abuse:
  enabled: false
  order_create_window_seconds: 600
  max_order_creations_per_user: 3
  max_order_creations_per_session: 3
  max_order_creations_per_ip: 12

order_number:
  # Keep a dedicated production secret in ORDER_NUMBER_SECRET. When empty,
  # the backend derives a domain-separated key from jwt.secret.
  secret: ""
  # Keep the immediately previous secret only while historical orders still
  # need their HMAC checksum verified after a rotation.
  previous_secret: ""
  # Use a distinct value per API instance only when horizontally scaling.
  node_id: 0

payment_risk:
  failure_window_seconds: 600
  failure_threshold: 3
  delay_seconds: 2
  high_risk_score: 60

payment_bin_rate_limit:
  enabled: true
  window_seconds: 60
  failure_threshold: 5
  block_duration_seconds: 1800

payment_gateway_circuit_breaker:
  enabled: true
  window_seconds: 60
  failure_rate_threshold: 0.15
  minimum_sample_count: 20
  open_duration_seconds: 30
  half_open_probe_timeout_seconds: 60

outbound_http_resilience:
  # Shared Redis-backed breaker for Google OAuth, Google Merchant, shipping, and Outbox webhooks.
  enabled: true
  retry_max_attempts: 3
  retry_base_delay_millis: 250
  retry_max_delay_millis: 3000
  retry_jitter_millis: 250
  failure_threshold: 4
  failure_window_seconds: 60
  open_duration_seconds: 30
  half_open_probe_timeout_seconds: 30

payment_risk_monitoring:
  enabled: true
  # External alerts require this opt-in and a configured Outbox webhook.
  alert_enabled: false
  window_days: 30
  minimum_successful_payments: 20
  warning_dispute_activity_rate: 0.005
  critical_dispute_activity_rate: 0.008
  warning_early_fraud_rate: 0.005
  critical_early_fraud_rate: 0.009
  warning_refund_rate: 0.08
  critical_refund_rate: 0.15
  auto_step_up_enabled: true

payment_protection:
  enabled: true
  max_control_duration_hours: 168
  max_pause_payment_duration_hours: 24
  max_global_pause_payment_duration_hours: 2

payment_3ds:
  adaptive_enabled: true
  low_risk_max_amount: 100.0
  trusted_paid_orders: 1
  visitor_risk_lookback_days: 30
  step_up_risk_score: 20
  challenge_risk_score: 60

log:
  level: "info"  # debug, info, warn, error
  format: "json"  # json or console
  output: "stdout"  # stdout or file path
