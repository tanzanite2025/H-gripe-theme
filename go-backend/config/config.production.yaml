server:
  port: ":9000"
  mode: release
  base_url: ""
  read_timeout: 120
  write_timeout: 120
  # Nginx web is pinned to this address on the dedicated api_ingress network.
  # The deployment environment may override it with the same exact address.
  trusted_proxies:
    - "172.30.0.10/32"

database:
  driver: postgres
  host: ${DB_HOST}
  port: ${DB_PORT}
  username: ${DB_USERNAME}
  password: ${DB_PASSWORD}
  database: ${DB_NAME}
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600
  auto_migrate: false
  log_level: silent

redis:
  # For long-lived multi-replica deployments prefer a managed Redis primary
  # endpoint or Sentinel mode. Cluster mode is intentionally rejected until all
  # multi-key rate-limit/anti-abuse scripts are migrated to shared hash tags.
  mode: standalone
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  addrs: []
  username: ""
  password: ${REDIS_PASSWORD}
  db: 0
  pool_size: 20
  master_name: ""
  sentinel_username: ""
  sentinel_password: ""

customer_service_realtime:
  # The production customer-service path is WebSocket-only. Every API replica
  # reads this shared Redis Stream, while the Outbox dispatcher publishes to it.
  enabled: true
  stream: "customer_service:{realtime}:v1"
  stream_max_len: 10000
  replay_limit: 200
  consumer_block_seconds: 5
  dedup_retention_seconds: 86400

jwt:
  secret: ${JWT_SECRET}
  expire_hours: 24
  refresh_expire_hours: 168

oauth:
  google_client_id: ${GOOGLE_CLIENT_ID}

google_merchant:
  # Set the OAuth credentials with GOOGLE_MERCHANT_* environment variables.
  # Keep these values empty in source control.
  client_id: ""
  client_secret: ""
  redirect_url: ""
  post_connect_url: ""
  token_encryption_key: ""
  state_ttl_seconds: 600

google_indexing:
  # Keep service account credentials outside source control. Configure through
  # GOOGLE_INDEXING_SERVICE_ACCOUNT_FILE or GOOGLE_INDEXING_SERVICE_ACCOUNT_JSON.
  enabled: false
  service_account_json: ""
  service_account_file: ""
  request_timeout_seconds: 15

social_oauth:
  # Set the provider credentials with SOCIAL_OAUTH_* environment variables.
  # Keep these values empty in source control.
  meta:
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes: ""
  x:
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes: ""
  youtube:
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes: ""
  reddit:
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes: ""
  post_connect_url: ""
  token_encryption_key: ""
  state_ttl_seconds: 600
  meta_graph_api_version: "v23.0"

i18n:
  default_locale: en
  supported_locales:
    - en
    - zh_cn
    - fr
    - de
    - es
    - ja
    - ko
    - it
    - pt
    - ru
    - ar
    - nl
    - tr
    - id
    - th
    - sv
    - da
    - fi
    - hi
    - ms

cors:
  allowed_origins: []
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Origin
    - Content-Type
    - Accept-Language
    - Idempotency-Key
    - X-CSRF-Token
    - X-Locale
    - X-Timezone
    - X-Display-Currency
    - X-Market-Country
    - X-Country-Code
    - X-Device-Fingerprint
    - X-Request-ID
    - X-Request-Timestamp
    - X-Request-Nonce
    - X-Request-Signature
    - X-Quick-Buy-Session
    - X-Anonymous-ID
  expose_headers:
    - Content-Length
    - X-Request-ID
    - Idempotency-Replayed
    - Retry-After
  allow_credentials: true
  max_age: 43200

cookie:
  secure: always
  same_site: lax
  domain: ""

cache:
  default_ttl: 3600
  post_ttl: 3600
  product_ttl: 1800
  product_lock_ttl: 5
  settings_ttl: 7200

worker:
  enabled: false
  tracking_polling_enabled: false
  tracking_polling_interval_seconds: 300
  tracking_polling_batch_limit: 20
  visitor_profile_ip_address_retention_days: 30
  # This scheduler is independent from worker.enabled and is required by the
  # durable customer-service Relay as well as the other Outbox consumers.
  outbox_dispatch_enabled: true
  outbox_dispatch_interval_seconds: 2
  outbox_dispatch_batch_limit: 100
  outbox_dispatch_lock_timeout_seconds: 300
  payment_expiration_enabled: true
  payment_expiration_interval_seconds: 900
  payment_pending_ttl_seconds: 1800
  payment_expiration_batch_limit: 100
  payment_risk_monitoring_enabled: true
  payment_risk_monitoring_interval_seconds: 3600
  # Automatic scheduled scans are disabled; operators trigger inspections manually.
  site_quality_auto_scan_enabled: false
  site_quality_dispatch_interval_seconds: 30
  site_quality_batch_limit: 1
  site_quality_lease_timeout_seconds: 900
  site_quality_sample_count: 3
  site_quality_confirmations: 2
  site_quality_clean_evaluations: 2
  site_quality_provider_concurrency: 1
  site_quality_provider_spacing_seconds: 5
  # Independent from worker.enabled. Keeps cached display exchange rates fresh once per day.
  exchange_rate_sync_enabled: true
  exchange_rate_sync_interval_seconds: 86400
  media_derivative_rebuild_enabled: true
  media_derivative_rebuild_interval_seconds: 5
  media_derivative_rebuild_batch_limit: 10

log:
  level: info
  format: json
  output: stdout

anti_abuse:
  turnstile_required: false
  turnstile_secret_key: ""
  verification_ip_window_seconds: 60
  verification_destination_window_seconds: 60
  verification_daily_limit: 8
  verification_global_window_seconds: 60
  verification_global_limit: 100
  verification_circuit_seconds: 300

order_abuse:
  enabled: true
  order_create_window_seconds: 600
  max_order_creations_per_user: 3
  max_order_creations_per_session: 3
  max_order_creations_per_ip: 12

order_number:
  secret: ""
  previous_secret: ""
  node_id: 0

payment_risk:
  failure_window_seconds: 600
  failure_threshold: 2
  delay_seconds: 2
  high_risk_score: 60

payment_bin_rate_limit:
  enabled: true
  window_seconds: 60
  failure_threshold: 5
  block_duration_seconds: 1800

payment_gateway_circuit_breaker:
  enabled: true
  window_seconds: 60
  failure_rate_threshold: 0.15
  minimum_sample_count: 20
  open_duration_seconds: 30
  # Must cover PayPal token acquisition plus payment creation. A single shared
  # probe protects every API replica after the open window expires.
  half_open_probe_timeout_seconds: 60

outbound_http_resilience:
  # Shared Redis-backed breaker for Google OAuth, Google Merchant, shipping, and Outbox webhooks.
  enabled: true
  retry_max_attempts: 3
  retry_base_delay_millis: 250
  retry_max_delay_millis: 3000
  retry_jitter_millis: 250
  failure_threshold: 4
  failure_window_seconds: 60
  open_duration_seconds: 30
  half_open_probe_timeout_seconds: 30

payment_risk_monitoring:
  enabled: true
  alert_enabled: false
  window_days: 30
  minimum_successful_payments: 20
  warning_dispute_activity_rate: 0.005
  critical_dispute_activity_rate: 0.008
  warning_early_fraud_rate: 0.005
  critical_early_fraud_rate: 0.009
  warning_refund_rate: 0.08
  critical_refund_rate: 0.15
  auto_step_up_enabled: true

payment_protection:
  enabled: true
  max_control_duration_hours: 168
  max_pause_payment_duration_hours: 24
  max_global_pause_payment_duration_hours: 2

payment_3ds:
  adaptive_enabled: true
  low_risk_max_amount: 100.0
  trusted_paid_orders: 1
  visitor_risk_lookback_days: 30
  step_up_risk_score: 20
  challenge_risk_score: 60

request_signing:
  enabled: false
  key: ""
  max_skew_seconds: 30
  required_paths: []

quick_buy_rate_limit:
  enabled: true
  ip_requests_per_minute: 120
  ip_burst: 40
  session_requests_per_minute: 60
  session_burst: 20
  fail_open: true

feedback_rate_limit:
  enabled: true
  read_ip_requests_per_minute: 120
  read_ip_burst: 40
  write_ip_requests_per_minute: 12
  write_ip_burst: 4
  write_user_requests_per_minute: 6
  write_user_burst: 2
  fail_open: false

media_upload:
  account_storage_quota_bytes: 21474836480
