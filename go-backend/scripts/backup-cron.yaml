# Legacy DATABASE-ONLY example, deliberately suspended. Independent of Hostinger.
# Supply the actual script before explicitly enabling:
# kubectl -n production create configmap postgres-database-backup-script --from-file=backup-database.sh=go-backend/scripts/backup-database.sh
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: production
spec:
  suspend: true
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: database-only-backup
              image: postgres:15-alpine
              command: ["/bin/bash", "/maintenance-scripts/backup-database.sh"]
              env:
                - name: DB_HOST
                  value: postgres.production
                - name: DB_NAME
                  value: commerce_platform
                - name: DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
                - name: BACKUP_DIR
                  value: /backups
              volumeMounts:
                - name: script
                  mountPath: /maintenance-scripts
                  readOnly: true
                - name: database-backup-storage
                  mountPath: /backups
          volumes:
            - name: script
              configMap:
                name: postgres-database-backup-script
                defaultMode: 0550
            - name: database-backup-storage
              persistentVolumeClaim:
                claimName: postgres-backup-pvc
