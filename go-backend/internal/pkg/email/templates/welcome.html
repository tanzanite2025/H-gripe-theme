<!doctype html>
<html>
  <body style="margin:0;background:#f6f7fb;color:#1f2937;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:640px;margin:0 auto;padding:32px 20px;">
      <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;padding:28px;">
        <p style="margin:0 0 16px;font-size:14px;color:#6b7280;">Welcome</p>
        <h1 style="margin:0 0 18px;font-size:24px;line-height:1.25;color:#111827;">Welcome to the store</h1>
        {{$customerName := field . "CustomerName" "Name" "FirstName" "customer_name" "first_name"}}
        <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">
          {{if $customerName}}Hi {{$customerName}},{{else}}Hi,{{end}} your account is ready.
        </p>
        <p style="margin:18px 0 0;font-size:15px;line-height:1.6;color:#4b5563;">You can sign in any time to review orders, manage account details, and follow new updates.</p>
      </div>
    </div>
  </body>
</html>
