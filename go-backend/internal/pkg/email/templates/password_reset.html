<!doctype html>
<html>
  <body style="margin:0;background:#f6f7fb;color:#1f2937;font-family:Arial,Helvetica,sans-serif;">
    <div style="max-width:640px;margin:0 auto;padding:32px 20px;">
      <div style="background:#ffffff;border:1px solid #e5e7eb;border-radius:8px;padding:28px;">
        <p style="margin:0 0 16px;font-size:14px;color:#6b7280;">Password reset</p>
        <h1 style="margin:0 0 18px;font-size:24px;line-height:1.25;color:#111827;">Reset your password</h1>
        {{$resetURL := field . "ResetURL" "ResetLink" "URL" "Link" "reset_url" "reset_link"}}
        <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">We received a request to reset your password.</p>
        {{if $resetURL}}
        <p style="margin:18px 0;font-size:15px;line-height:1.6;"><a href="{{$resetURL}}" style="color:#2563eb;">Reset password</a></p>
        {{end}}
        <p style="margin:18px 0 0;font-size:15px;line-height:1.6;color:#4b5563;">If you did not request this, you can ignore this email.</p>
      </div>
    </div>
  </body>
</html>
