<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="preload"
      href="/src/assets/fonts/maple-ui/MapleUI-CJK.f8ce6d72e8cb.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <style>
      #admin-initial-loading-indicator {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f1f5f9;
      }
      #admin-initial-loading-indicator::after {
        content: '';
        width: 24px;
        height: 24px;
        border: 2px solid #cbd5e1;
        border-top-color: #059669;
        border-radius: 50%;
        animation: admin-initial-loading-spin 0.8s linear infinite;
      }
      @keyframes admin-initial-loading-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #admin-initial-loading-indicator::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="admin-initial-loading-indicator" role="status" aria-label="正在加载 / Loading"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
