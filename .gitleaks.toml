[extend]
useDefault = true

[allowlist]
description = "Historical documentation examples only; keep all other findings blocking."
condition = "AND"
regexTarget = "match"
paths = [
  '''(^|/)API_TESTING_GUIDE\.md$''',
  '''(^|/)API\.md$''',
  '''(^|/)SUBSCRIPTION_QUICK_REFERENCE\.md$''',
  '''(^|/)QUICK_START\.md$''',
  '''(^|/)PROJECT_COMPLETE\.md$''',
  '''(^|/)BUGFIX_P1_BROWSING_HISTORY\.md$''',
]
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''',
  '''abc123def456\.\.\.''',
  '''Authorization:\s*Bearer\s+YOUR_(?:TOKEN(?:_HERE)?|JWT_TOKEN)''',
]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "False positive test idempotency key for loyalty gift-card redemption replay."
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''(^|/)go-backend/internal/service/marketing_redeem_service_test\.go$''',
  ]
  regexes = [
    '''IdempotencyKey:\s*"test-redemption-42"''',
  ]
