[extend]
useDefault = true

[allowlist]
description = "Historical documentation examples only; keep all other findings blocking."
condition = "AND"
regexTarget = "match"
paths = [
  '''(^|/)API_TESTING_GUIDE\.md$''',
  '''(^|/)API\.md$''',
  '''(^|/)SUBSCRIPTION_QUICK_REFERENCE\.md$''',
  '''(^|/)QUICK_START\.md$''',
  '''(^|/)PROJECT_COMPLETE\.md$''',
  '''(^|/)BUGFIX_P1_BROWSING_HISTORY\.md$''',
]
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.\.\.''',
  '''abc123def456\.\.\.''',
  '''Authorization:\s*Bearer\s+YOUR_(?:TOKEN(?:_HERE)?|JWT_TOKEN)''',
]

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "False positive test idempotency key for loyalty gift-card redemption replay."
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''(^|/)go-backend/internal/service/marketing_redeem_service_test\.go$''',
  ]
  regexes = [
    '''IdempotencyKey:\s*"test-redemption-42"''',
  ]

  [[rules.allowlists]]
  description = "False positive WeChat Pay API v3 test key material."
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''(^|/)go-backend/internal/api/v1/payment/wallet_order_handler_test\.go$''',
    '''(^|/)go-backend/internal/pkg/payment/runtime_readiness_test\.go$''',
    '''(^|/)go-backend/internal/pkg/payment/provider_webhook_verifier_test\.go$''',
  ]
  regexes = [
    '''t\.Setenv\("WECHAT_API_V3_KEY",\s*"[0-9a-f]{32}"\)''',
    '''WechatAPIv3Key:\s*"[0-9a-f]{32}"''',
  ]

  [[rules.allowlists]]
  description = "False positive object storage key prefix comparison."
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''(^|/)go-backend/internal/service/showcase_image_storage_service\.go$''',
  ]
  regexes = [
    '''strings\.HasPrefix\(normalizedKey,\s*normalizedPrefix\+"/"\)''',
  ]
